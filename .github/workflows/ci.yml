name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, inspect and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify the project
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-quality-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
            target/bom.json

      - name: Build the container image
        run: docker build --tag sentinel-risk-service:${{ github.sha }} .
